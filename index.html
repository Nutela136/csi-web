<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Thanh trên cùng: nút quay lại (ẩn ở trang chủ) + tiêu đề -->
  <header class="topbar">
    <button id="back" class="icon-btn" aria-label="Quay lại" hidden>←</button>
    <h1 id="title">CSI</h1>
  </header>

  <!-- Nội dung từng màn hình được vẽ vào đây bởi app.js -->
  <main id="app"></main>

  <!-- Hộp thoại nhập tên (dùng chung cho thêm phòng / thêm ESP) -->
  <dialog id="dlg">
    <form method="dialog">
      <h2 id="dlg-title">Thêm</h2>
      <input id="dlg-input" required autocomplete="off">
      <div class="row">
        <button value="cancel" formnovalidate>Huỷ</button>
        <button value="ok" class="primary">Thêm</button>
      </div>
    </form>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
